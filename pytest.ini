[pytest]
pythonpath = .
markers =
    integration: tests that run the compiled collector binary (require 'make' first)
    privileged: requires root (BCC/eBPF); run with 'make test-privileged' as root
    bpf: loads eBPF programs through BCC
    docker: requires a working Docker daemon and the busybox:1.36 image
    slow: takes more than about ten seconds
